services:
  jenkins:
    # Jenkins controller that runs the CI pipeline and stores job state in a persistent volume.
    image: jenkins/jenkins:lts
    container_name: jenkins-compose
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home


volumes:
  # Keep Jenkins job metadata, plugins, and build history between container restarts.
  jenkins_home:
